syntax = "proto3";

package logengine.query.v1;

message Empty {}

message StatusReply {
  string routing_strategy = 1;
  uint32 routing_shards = 2;
  uint64 routing_virtual_nodes = 3;
  uint64 ring_size = 4;
  string log_dir = 5;
  string archive_dir = 6;
  string shard_file_prefix = 7;
  uint64 reader_segments_read = 8;
  uint64 reader_archive_segments_read = 9;
  uint64 reader_active_segments_read = 10;
  uint64 reader_records_returned = 11;
  uint64 reader_corrupted_segments = 12;
  uint64 reader_corrupted_lines = 13;
  uint64 reader_gzip_read_errors = 14;
  string health = 15;
  uint64 log_manager_rotate_operations = 16;
  uint64 log_manager_checkpoint_write_successes = 17;
  uint64 log_manager_checkpoint_write_failures = 18;
  uint64 log_manager_recovery_fallbacks = 19;
  uint64 log_manager_gzip_archive_successes = 20;
  uint64 log_manager_gzip_archive_failures = 21;
}

message RouteRequest {
  string route_key = 1;
}

message RouteReply {
  string route_key = 1;
  uint32 shard = 2;
  uint64 hash = 3;
  uint64 token = 4;
  bool used_local_fallback = 5;
}

message QueryRecordsRequest {
  optional uint32 shard = 1;
  optional uint64 seq_from = 2;
  optional uint64 seq_to = 3;
  optional string time_from = 4;
  optional string time_to = 5;
  uint64 limit = 6;
  bool include_archive = 7;
}

message QueryRecord {
  uint32 crc = 1;
  string timestamp = 2;
  uint32 shard = 3;
  bool has_sequence = 4;
  uint64 sequence = 5;
  string level = 6;
  string payload = 7;
  string raw_line = 8;
}

message QueryRecordsReply {
  repeated QueryRecord records = 1;
}

service QueryService {
  rpc GetStatus(Empty) returns (StatusReply);
  rpc Route(RouteRequest) returns (RouteReply);
  rpc QueryRecords(QueryRecordsRequest) returns (QueryRecordsReply);
}
