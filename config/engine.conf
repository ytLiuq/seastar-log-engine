# Demo config file for log_engine_* binaries.
log-dir=logs
archive-dir=archive
shard-file-prefix=shard
batch-size=256
flush-ms=1
write-behind=4
write-retry-count=3
write-retry-backoff-ms=2
max-pending-bytes=262144
pending-bytes-low-watermark=131072
rotate-size-bytes=4096
rotate-interval-seconds=0
archive-retention-seconds=0
max-archived-files=2
truncate-on-start=true
checkpoint-enabled=true
compress-archives=true
messages=40
payload-size=96
route-keys=8
inflight=128
include-archive=true
