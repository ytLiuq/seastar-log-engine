# Minimal seastar-log-agent example.
#
# Start:
#   ./build/log_engine_agent --config config/agent.conf -c 2
#
# Ingest:
#   curl -X POST http://127.0.0.1:18081/v1/logs \
#     -H 'Content-Type: application/json' \
#     -d '{"service":"order","level":"info","message":"created order"}'

log-dir=agent-logs
archive-dir=agent-archive
shard-file-prefix=shard

ack-mode=sync_ack
routing-strategy=hash_modulo
empty-route-policy=round_robin
batch-size=32
flush-ms=100

checkpoint-enabled=true
truncate-on-start=false
record-crc-enabled=true
record-crc-class=full
record-timestamp-enabled=true
record-level-enabled=true
record-shard-id-enabled=true
record-sequence-enabled=true

max-pending-bytes=67108864
pending-bytes-low-watermark=33554432
rotate-size-bytes=268435456
max-archived-files=32

http-ingest-address=0.0.0.0
http-ingest-port=18081
max-request-bytes=1048576

# Optional file tail source. Leave empty to disable.
file-source-path=
file-source-glob=
stdin-source-enabled=false
unix-socket-source-path=
tcp-source-port=0
udp-source-port=0
source-offset-path=agent-source.offset
source-poll-ms=1000
source-max-lines=1024

# Optional downstream HTTP sink. Leave empty to disable.
sink-kind=none
sink-http-url=
delivery-offset-path=agent-delivery.offset
sink-batch-size=100
sink-retry-backoff-ms=1000
sink-retry-max-backoff-ms=30000

# Dynamic source backpressure. 0 disables each threshold.
max-buffer-bytes=0
resume-buffer-bytes=0
max-sink-backlog-records=0
max-recent-sink-failures=0
max-sink-latency-ms=0
