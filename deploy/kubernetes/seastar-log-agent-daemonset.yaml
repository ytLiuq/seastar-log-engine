apiVersion: v1
kind: ConfigMap
metadata:
  name: seastar-log-agent-config
  namespace: logging
data:
  agent.conf: |
    log-dir=/var/lib/seastar-log-agent/logs
    archive-dir=/var/lib/seastar-log-agent/archive
    checkpoint-enabled=true
    record-crc-enabled=true
    record-sequence-enabled=true
    http-ingest-address=0.0.0.0
    http-ingest-port=18081
    agent-id=seastar-log-agent
    file-source-glob=/host/var/log/*.log
    sink-kind=stdout
    source-offset-path=/var/lib/seastar-log-agent/agent-source.offset
    delivery-offset-path=/var/lib/seastar-log-agent/agent-delivery.offset
    pending-delivery-path=/var/lib/seastar-log-agent/agent-delivery.pending
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seastar-log-agent
  namespace: logging
spec:
  selector:
    matchLabels:
      app: seastar-log-agent
  template:
    metadata:
      labels:
        app: seastar-log-agent
    spec:
      serviceAccountName: seastar-log-agent
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: agent
          image: seastar-log-engine:agent
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/seastar-log-agent/agent.conf
            - -c
            - "1"
          ports:
            - containerPort: 18081
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/seastar-log-agent
              readOnly: true
            - name: host-logs
              mountPath: /host/var/log
              readOnly: true
            - name: data
              mountPath: /var/lib/seastar-log-agent
      volumes:
        - name: config
          configMap:
            name: seastar-log-agent-config
        - name: host-logs
          hostPath:
            path: /var/log
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/seastar-log-agent
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seastar-log-agent
  namespace: logging
